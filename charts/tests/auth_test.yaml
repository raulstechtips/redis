suite: Credential precedence
templates:
  - templates/auth.yaml
release:
  name: redis
  namespace: redis
tests:
  - it: generates a credential when no source is provided
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: redis-credentials
      - matchRegex:
          path: data.password
          pattern: '^[A-Za-z0-9+/]{86}==$'
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
  - it: leaves an existing Secret unmanaged
    set:
      auth.existingSecret: supplied
    asserts:
      - hasDocuments:
          count: 0
  - it: selects Infisical before an existing Secret
    set:
      auth.existingSecret: ignored
      auth.infisical.enabled: true
      auth.infisical.authRef.name: shared
      auth.infisical.authRef.namespace: infisical-secrets-operator
      auth.infisical.projectSlug: homelab
      auth.infisical.environmentSlug: dev
      auth.infisical.secretPath: /redis
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: spec.targets[0].name
          value: redis-credentials
      - equal:
          path: spec.sources[0].secretPath
          value: /redis
      - equal:
          path: spec.targets[0].template.data.password
          value: '{{ (index . "REDIS_PASSWORD").Value }}'
