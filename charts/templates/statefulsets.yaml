{{- $root := . -}}
{{- $roles := list "redis" -}}
{{- if eq .Values.mode "sentinel" -}}
{{- $roles = append $roles "sentinel" -}}
{{- end -}}
{{- range $role := $roles }}
{{- $settings := index $root.Values $role }}
{{- $persistent := or (eq $role "sentinel") $root.Values.redis.persistence.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $root.Release.Name }}-{{ $role }}
  labels:
    {{- include "redis.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  serviceName: {{ $root.Release.Name }}-{{ $role }}-headless
  replicas: {{ if eq $role "sentinel" }}{{ $settings.replicas }}{{ else if eq $root.Values.mode "sentinel" }}{{ add 1 $settings.replicas }}{{ else }}1{{ end }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $role }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $root.Values.mode "sentinel" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: {{ $root.Release.Name }}
                  app.kubernetes.io/component: {{ $role }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: {{ $role }}
          image: {{ printf "%s:%s" $root.Values.image.repository $root.Values.image.tag | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: [{{ $role | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: {{ $role }}
              containerPort: {{ if eq $role "redis" }}6379{{ else }}26379{{ end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_HOST
              value: {{ printf "$(POD_NAME).%s-%s-headless.%s.svc.%s" $root.Release.Name $role $root.Release.Namespace $root.Values.clusterDomain | quote }}
            - name: MODE
              value: {{ $root.Values.mode | quote }}
            - name: TLS_ENABLED
              value: {{ $root.Values.tls.enabled | quote }}
            - name: MASTER_NAME
              value: {{ $root.Values.sentinel.masterName | quote }}
            {{- if eq $role "redis" }}
            - name: MAXMEMORY
              value: {{ $root.Values.redis.maxmemory | quote }}
            - name: EVICTION_POLICY
              value: {{ $root.Values.redis.evictionPolicy | quote }}
            - name: APPENDONLY
              value: {{ ternary "yes" "no" $persistent | quote }}
            {{- if eq $root.Values.mode "sentinel" }}
            - name: SENTINEL_HOSTS
              value: {{ include "redis.sentinelHosts" $root | quote }}
            - name: DATA_HOSTS
              value: {{ include "redis.dataHosts" $root | quote }}
            - name: SENTINEL_MAJORITY
              value: {{ add 1 (div (int $root.Values.sentinel.replicas) 2) | quote }}
            {{- end }}
            {{- else }}
            - name: BOOTSTRAP_PRIMARY
              value: {{ printf "%s-redis-0.%s-redis-headless.%s.svc.%s" $root.Release.Name $root.Release.Name $root.Release.Namespace $root.Values.clusterDomain | quote }}
            - name: SENTINEL_QUORUM
              value: {{ $root.Values.sentinel.quorum | quote }}
            - name: DOWN_AFTER_MS
              value: {{ $root.Values.sentinel.downAfterMilliseconds | quote }}
            - name: FAILOVER_TIMEOUT_MS
              value: {{ $root.Values.sentinel.failoverTimeoutMilliseconds | quote }}
            {{- end }}
          startupProbe:
            exec:
              command: ["/usr/local/lib/redis/healthcheck.sh", {{ $role | quote }}, "live"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/usr/local/lib/redis/healthcheck.sh", {{ $role | quote }}, "live"]
            periodSeconds: 10
            timeoutSeconds: 4
          readinessProbe:
            exec:
              command: ["/usr/local/lib/redis/healthcheck.sh", {{ $role | quote }}, "ready"]
            periodSeconds: 5
            timeoutSeconds: 8
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /run/redis
            - name: auth
              mountPath: /secrets
              readOnly: true
            {{- if $root.Values.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: auth
          secret:
            secretName: {{ include "redis.secret" $root }}
            defaultMode: 0440
            items:
              - key: {{ $root.Values.auth.passwordKey }}
                path: password
        {{- if $root.Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ $root.Values.tls.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if not $persistent }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if $persistent }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ $settings.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ $settings.persistence.size | quote }}
  {{- end }}
{{- end }}
