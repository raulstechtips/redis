{{- $roles := list "redis" -}}
{{- if eq .Values.mode "sentinel" -}}
{{- $roles = append $roles "sentinel" -}}
{{- end -}}
{{- range $role := $roles }}
{{- $component := ternary "node" "sentinel" (eq $role "redis") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis.fullname" $ }}-{{ $component }}-headless
  labels:
    {{- include "redis.labels" $ | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ include "redis.name" $ }}
    app.kubernetes.io/component: {{ $role }}
  ports:
    - name: {{ $role }}
      port: {{ if eq $role "redis" }}6379{{ else }}26379{{ end }}
      targetPort: {{ $role }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis.fullname" . }}{{ if eq .Values.mode "sentinel" }}-sentinel{{ end }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "redis.name" . }}
    app.kubernetes.io/component: {{ .Values.mode | replace "standalone" "redis" }}
  ports:
    - name: client
      port: {{ if eq .Values.mode "standalone" }}6379{{ else }}26379{{ end }}
      targetPort: {{ .Values.mode | replace "standalone" "redis" }}
